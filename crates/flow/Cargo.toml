[package]
name = "lspkit-flow"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "An in-process harness for flow tests of a language server built on lspkit-runtime."
readme = "README.md"

[dependencies]
futures-util = "0.3"
serde_json = "1"
# The paused clock a test moves is `test-util`; this crate is only ever a dev-dependency.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }
# The service and its client, as a server is served: lspkit's own loop.
lspkit-runtime = { path = "../runtime" }

[dev-dependencies]
expect-test.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
