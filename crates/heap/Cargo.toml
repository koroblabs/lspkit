[package]
name = "lspkit-heap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "A global allocator for language servers that returns large freed blocks to the OS and counts live memory."
readme = "README.md"

[features]
# Asks mimalloc to collect in `release_freed`, for a binary that has mimalloc in it: through
# `override` below, or because it installs mimalloc as its global allocator itself, and sets two
# of mimalloc's options before `main` (`MI_OPTION_ABANDONED_PAGE_PURGE`, `MI_OPTION_ALLOW_THP`). Version 2 of
# mimalloc, not the crate's default 3: measured in phrost after indexing 29 094 files (macOS 27,
# 2026-11-09), v3 left a footprint of 207 MB where v2 left 160 MB, and peaked at 280 MB against
# 200 MB, with the same indexing time.
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/extended", "libmimalloc-sys/v2"]
# mimalloc as the process's `malloc`: under `Heap`'s small allocations, and under every C library
# in the binary, such as a parser. `release_freed` then collects what they freed too, which macOS's
# allocator never gives back (see the crate docs). On Windows the C library keeps its own malloc,
# since mimalloc overrides it only in a shared build.
override = ["mimalloc", "libmimalloc-sys/override"]

[dependencies]
libmimalloc-sys = { version = "0.1.49", optional = true }

# The only crate in the workspace allowed `unsafe`, for a global allocator and its foreign calls.
# The workspace forbids it everywhere else, so this crate cannot inherit the workspace lints.
[lints.rust]
unsafe_code = "allow"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
