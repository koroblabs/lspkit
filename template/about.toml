# `just licenses`: the licenses of every crate the binary links, for a release archive.
# Keep `accepted` in step with deny.toml, which CI checks.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
# Only what ends up in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
