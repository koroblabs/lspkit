[package]
name = "kitserver-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The kitserver language server: documents in, findings out."

[dependencies]
kitserver-check.workspace = true
lspkit-runtime.workspace = true
lspkit-text = { workspace = true, features = ["lsp"] }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
expect-test.workspace = true
lspkit-flow.workspace = true
lspkit-fuzz.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
